name: Datenquellen prüfen

# Läuft täglich. Schlägt der Lauf fehl, schickt GitHub automatisch eine E-Mail
# an den Besitzer des Repositories (Benachrichtigungen für Actions müssen aktiv sein).
on:
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Quelle für Geschenkcodes prüfen
        run: node scripts/check-codes.js

      - name: Quelle für die Rose der Woche prüfen
        if: always()
        run: node scripts/check-rose.js
